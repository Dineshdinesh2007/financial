version: "3.8"

services:
  backend:
    build: .
    container_name: finguard-backend
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./finguard.db:/app/finguard.db
    environment:
      - FINGUARD_API_HOST=0.0.0.0
      - FINGUARD_API_PORT=8000
    restart: unless-stopped

  dashboard:
    build: .
    container_name: finguard-dashboard
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - FINGUARD_API_HOST=backend
      - FINGUARD_API_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped
